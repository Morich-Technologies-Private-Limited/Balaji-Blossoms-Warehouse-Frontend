name: Frontend Build & Deploy (Vite)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Vite frontend
        run: npm run build

      - name: Clean frontend directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/balaji-blossoms-frontend
            rm -rf /var/www/balaji-blossoms-frontend/*

      - name: Upload dist contents to VPS (NO dist folder)
        run: |
          tar -C dist -czf dist.tar.gz .
          ssh -o StrictHostKeyChecking=no \
              -i <(echo "${{ secrets.VPS_SSH_KEY }}") \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "tar -xzf - -C /var/www/balaji-blossoms-frontend" < dist.tar.gz
